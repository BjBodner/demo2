<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Parabola Visualization</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            background-color: #f0f0f0;
        }
        canvas {
            background-color: white;
            border: 1px solid #ccc;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .controls {
            margin-top: 20px;
            display: grid;
            grid-template-columns: auto 200px auto;
            gap: 10px;
            align-items: center;
        }
        .nav {
            margin-bottom: 20px;
            align-self: flex-start;
        }
        button {
            padding: 8px 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="nav">
        <button onclick="window.location.href='index.html'">← Back to Index</button>
    </div>
    <h1>Interactive Parabola: y = ax² + bx + c</h1>
    <canvas id="canvas" width="600" height="400"></canvas>
    <div class="controls">
        <label for="a">a:</label>
        <input type="range" id="a" min="-5" max="5" step="0.1" value="1">
        <span id="aVal">1</span>

        <label for="b">b:</label>
        <input type="range" id="b" min="-10" max="10" step="0.1" value="0">
        <span id="bVal">0</span>

        <label for="c">c:</label>
        <input type="range" id="c" min="-100" max="100" step="1" value="0">
        <span id="cVal">0</span>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const aInput = document.getElementById('a');
        const bInput = document.getElementById('b');
        const cInput = document.getElementById('c');
        const aVal = document.getElementById('aVal');
        const bVal = document.getElementById('bVal');
        const cVal = document.getElementById('cVal');

        function draw() {
            const a = parseFloat(aInput.value);
            const b = parseFloat(bInput.value);
            const c = parseFloat(cInput.value);

            aVal.textContent = a;
            bVal.textContent = b;
            cVal.textContent = c;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw axes
            ctx.strokeStyle = '#ddd';
            ctx.beginPath();
            ctx.moveTo(0, canvas.height / 2);
            ctx.lineTo(canvas.width, canvas.height / 2);
            ctx.moveTo(canvas.width / 2, 0);
            ctx.lineTo(canvas.width / 2, canvas.height);
            ctx.stroke();

            // Draw parabola
            ctx.strokeStyle = 'blue';
            ctx.lineWidth = 2;
            ctx.beginPath();

            const scale = 10; // pixels per unit
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;

            for (let px = 0; px <= canvas.width; px++) {
                const x = (px - centerX) / scale;
                const y = a * x * x + b * x + c;
                const py = centerY - y * scale;

                if (px === 0) {
                    ctx.moveTo(px, py);
                } else {
                    ctx.lineTo(px, py);
                }
            }
            ctx.stroke();
        }

        [aInput, bInput, cInput].forEach(input => {
            input.addEventListener('input', draw);
        });

        draw();
    </script>
</body>
</html>
