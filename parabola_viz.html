<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Parabola Visualization</title>
    <style>
        :root {
            --bg-color: #f0f0f0;
            --canvas-bg: white;
            --canvas-border: #ccc;
            --text-color: #333;
            --axis-color: #ddd;
            --parabola-color: blue;
            --button-bg: #fff;
            --button-text: #333;
            --button-border: #ccc;
        }
        
        [data-theme="dark"] {
            --bg-color: #1a1a2e;
            --canvas-bg: #16213e;
            --canvas-border: #0f3460;
            --text-color: #e0e0e0;
            --axis-color: #4a4a6a;
            --parabola-color: #00d4ff;
            --button-bg: #0f3460;
            --button-text: #e0e0e0;
            --button-border: #1a1a2e;
        }
        
        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.3s, color 0.3s;
        }
        canvas {
            background-color: var(--canvas-bg);
            border: 1px solid var(--canvas-border);
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transition: background-color 0.3s, border-color 0.3s;
        }
        .controls {
            margin-top: 20px;
            display: grid;
            grid-template-columns: auto 200px auto;
            gap: 10px;
            align-items: center;
        }
        .nav {
            margin-bottom: 20px;
            align-self: flex-start;
            display: flex;
            gap: 10px;
        }
        button {
            padding: 8px 16px;
            cursor: pointer;
            background-color: var(--button-bg);
            color: var(--button-text);
            border: 1px solid var(--button-border);
            border-radius: 4px;
            transition: background-color 0.3s, color 0.3s;
        }
        button:hover {
            opacity: 0.8;
        }
        .theme-toggle {
            display: flex;
            align-items: center;
            gap: 5px;
        }
    </style>
</head>
<body>
    <div class="nav">
        <button onclick="window.location.href='index.html'">← Back to Index</button>
        <button id="themeToggle" class="theme-toggle" onclick="toggleTheme()">🌙 Dark Mode</button>
    </div>
    <h1>Interactive Parabola: y = ax² + bx + c</h1>
    <canvas id="canvas" width="600" height="400"></canvas>
    <div class="controls">
        <label for="a">a:</label>
        <input type="range" id="a" min="-5" max="5" step="0.1" value="1">
        <span id="aVal">1</span>

        <label for="b">b:</label>
        <input type="range" id="b" min="-10" max="10" step="0.1" value="0">
        <span id="bVal">0</span>

        <label for="c">c:</label>
        <input type="range" id="c" min="-100" max="100" step="1" value="0">
        <span id="cVal">0</span>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const aInput = document.getElementById('a');
        const bInput = document.getElementById('b');
        const cInput = document.getElementById('c');
        const aVal = document.getElementById('aVal');
        const bVal = document.getElementById('bVal');
        const cVal = document.getElementById('cVal');
        const themeToggle = document.getElementById('themeToggle');

        // Cache theme colors to avoid repeated getComputedStyle calls
        let cachedColors = null;

        function updateCachedColors() {
            const style = getComputedStyle(document.documentElement);
            cachedColors = {
                axis: style.getPropertyValue('--axis-color').trim(),
                parabola: style.getPropertyValue('--parabola-color').trim()
            };
        }

        function draw() {
            const a = parseFloat(aInput.value);
            const b = parseFloat(bInput.value);
            const c = parseFloat(cInput.value);

            aVal.textContent = a;
            bVal.textContent = b;
            cVal.textContent = c;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw axes
            ctx.strokeStyle = cachedColors.axis;
            ctx.beginPath();
            ctx.moveTo(0, canvas.height / 2);
            ctx.lineTo(canvas.width, canvas.height / 2);
            ctx.moveTo(canvas.width / 2, 0);
            ctx.lineTo(canvas.width / 2, canvas.height);
            ctx.stroke();

            // Draw parabola
            ctx.strokeStyle = cachedColors.parabola;
            ctx.lineWidth = 2;
            ctx.beginPath();

            const scale = 10; // pixels per unit
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;

            for (let px = 0; px <= canvas.width; px++) {
                const x = (px - centerX) / scale;
                const y = a * x * x + b * x + c;
                const py = centerY - y * scale;

                if (px === 0) {
                    ctx.moveTo(px, py);
                } else {
                    ctx.lineTo(px, py);
                }
            }
            ctx.stroke();
        }

        function applyTheme(isDark) {
            const html = document.documentElement;
            if (isDark) {
                html.setAttribute('data-theme', 'dark');
                themeToggle.textContent = '☀️ Light Mode';
            } else {
                html.removeAttribute('data-theme');
                themeToggle.textContent = '🌙 Dark Mode';
            }
            updateCachedColors();
        }

        function toggleTheme() {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            const newTheme = !isDark;
            
            localStorage.setItem('theme', newTheme ? 'dark' : 'light');
            applyTheme(newTheme);
            draw();
        }

        // Initialize theme from localStorage or default to light
        function initTheme() {
            const savedTheme = localStorage.getItem('theme');
            const isDark = savedTheme === 'dark';
            applyTheme(isDark);
            draw();
        }

        [aInput, bInput, cInput].forEach(input => {
            input.addEventListener('input', draw);
        });

        initTheme();
    </script>
</body>
</html>
